spring:
  application:
    name: hotel_api


  datasource:
    url: jdbc:mysql://localhost:3306/hotel_db?serverTimezone=America/Bogota
    username: root
    password: ""


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: America/Bogota